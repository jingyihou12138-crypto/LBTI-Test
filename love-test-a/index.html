<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>恋爱人设测试 A · 你是哪种恋爱体质？</title>
<style>
  :root{--bg1:#fdeef4;--bg2:#ece9ff;--bg3:#e3f3ff;--ink:#3a2e45;--sub:#8b7f99;--brand:#b46cf0;--brand2:#f06cae;--card:rgba(255,255,255,.82);--radius:22px;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 48%,var(--bg3) 100%) fixed;min-height:100vh;}
  .wrap{max-width:480px;margin:0 auto;padding:28px 18px 60px;}
  header{text-align:center;margin-bottom:22px;}
  header .stars{font-size:30px;letter-spacing:6px;}
  header h1{font-size:26px;margin:8px 0 6px;font-weight:800;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  header p{color:var(--sub);font-size:13px;}
  .ver{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#7a5fa8;background:#f3ecfd;}
  .card{background:var(--card);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);border-radius:var(--radius);box-shadow:0 10px 34px rgba(150,110,220,.13);padding:20px 18px;margin-bottom:16px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#6d5a86;}
  .field label .opt{font-weight:400;color:var(--sub);font-size:12px;}
  input,select{width:100%;padding:12px 14px;font-size:15px;color:var(--ink);border:1.5px solid #e6dcf5;border-radius:14px;background:#fff;outline:none;appearance:none;-webkit-appearance:none;}
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(180,108,240,.14);}
  .row{display:flex;gap:10px;} .row>.field{flex:1;}
  .notime-btn{display:block;width:100%;margin-top:10px;padding:11px 14px;font-size:13.5px;font-weight:700;color:var(--sub);text-align:center;background:#fff;border:1.5px dashed #d8c9ef;border-radius:14px;cursor:pointer;transition:all .15s;}
  .notime-btn::before{content:'○ ';}
  .notime-btn.on{color:#fff;border:1.5px solid transparent;background:linear-gradient(90deg,var(--brand),var(--brand2));box-shadow:0 4px 14px rgba(200,100,200,.3);}
  .notime-btn.on::before{content:'✓ ';}
  .notime-hint{display:none;margin-top:8px;padding:9px 12px;font-size:12.5px;line-height:1.6;color:#8a63b8;background:#f7f2ff;border-radius:12px;}
  .notime-hint.show{display:block;}
  .adv-toggle{font-size:12.5px;color:var(--brand);cursor:pointer;user-select:none;margin:-6px 0 12px;display:inline-block;}
  #advBox{display:none;padding:12px;background:#f7f2ff;border-radius:14px;margin-bottom:14px;} #advBox.show{display:block;}
  #advBox .hint{font-size:11.5px;color:var(--sub);margin-top:6px;line-height:1.5;}
  .btn{width:100%;padding:15px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--brand),var(--brand2));border:none;border-radius:16px;cursor:pointer;box-shadow:0 8px 22px rgba(200,100,200,.35);transition:transform .12s;}
  .btn:active{transform:scale(.97);}
  .err{color:#e0507a;font-size:13px;margin-top:10px;display:none;text-align:center;}
  #result{display:none;}
  /* 人设卡 / CP 卡 共用同一套版式 */
  .pcard{text-align:center;padding:30px 22px 26px;}
  .pcard img{width:200px;max-width:64%;height:auto;display:block;margin:0 auto;
    filter:drop-shadow(0 10px 22px rgba(150,110,220,.20));}
  .pcard .emoji{font-size:96px;line-height:1;display:none;}
  .pcard h2{font-size:30px;font-weight:900;letter-spacing:1.5px;margin:14px 0 5px;color:#3a2e45;}
  .pcard .code{color:#b48ce0;font-weight:700;font-size:12px;letter-spacing:3px;}
  .pcard .lead{font-size:16px;font-weight:700;line-height:1.85;letter-spacing:.3px;
    margin:22px 0 0;color:#54446e;}
  .pcard .body{font-size:14.5px;line-height:2.05;letter-spacing:.3px;color:#7b6c8c;
    white-space:pre-line;text-align:left;margin-top:14px;}
  .divider{width:38px;height:3px;border-radius:99px;margin:20px auto 0;
    background:linear-gradient(90deg,var(--brand),var(--brand2));opacity:.5;}
  .cp-cap{font-size:12px;font-weight:700;letter-spacing:4px;color:#b6a6c9;
    text-align:center;margin-bottom:2px;}
  details{margin-top:4px;} summary{cursor:pointer;font-size:13px;color:var(--sub);padding:6px 0;}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
  th,td{padding:5px 4px;text-align:center;border-bottom:1px solid #eee3f8;}
  th{color:#8b7f99;font-weight:700;} tr.win td{color:var(--brand);font-weight:800;}
  #dbgWarn{font-size:12px;color:#c9737f;margin:6px 0;}
  .again{display:block;text-align:center;color:var(--brand);font-size:14px;font-weight:700;margin-top:6px;cursor:pointer;}
  footer{text-align:center;font-size:11px;color:#b6aac4;margin-top:26px;line-height:1.9;}
  footer a{color:#a89bbd;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="stars">✦ ⋆ ˚ ☾ ˚ ⋆ ✦</div>
    <h1>恋爱人设测试</h1>
    <p>MBTI × 星盘 · 测测你是哪种恋爱体质</p>
    <span class="ver">方案 A · 12 维贴合</span>
  </header>

  <div class="card" id="form">
    <div class="field"><label>出生日期</label>
      <div class="row"><select id="selYear"></select><select id="selMonth"></select><select id="selDay"></select></div>
    </div>
    <div class="field"><label>出生时间 <span class="opt">（不知道可点下方按钮）</span></label>
      <div class="row" id="timeRow"><select id="selHour"></select><select id="selMinute"></select></div>
      <button type="button" class="notime-btn" id="noTimeBtn" aria-pressed="false">我不知道出生时间</button>
      <div class="notime-hint" id="noTimeHint">不知道出生时间：上升与宫位不参与计算，结果置信度会降到最低档。再点一次可取消。</div>
    </div>
    <div class="field"><label>出生地点</label>
      <div class="row"><select id="selProvince"></select><select id="selCity"></select></div>
    </div>
    <span class="adv-toggle" id="advToggle">⚙️ 城市不在列表？手动输入经纬度 ▾</span>
    <div id="advBox">
      <div class="row">
        <div class="field"><label>纬度（北正南负）</label><input type="number" id="lat" step="0.0001" placeholder="39.63"></div>
        <div class="field"><label>经度（东正西负）</label><input type="number" id="lng" step="0.0001" placeholder="118.18"></div>
      </div>
      <div class="field"><label>当地时区（UTC 偏移小时）</label><input type="number" id="utcoff" step="0.5" placeholder="8"></div>
      <div class="hint">填了经纬度就用手动值；时区填出生当时当地与 UTC 的时差（中国 8，首尔/东京 9，纽约冬令时 -5）。</div>
    </div>
    <div class="field"><label>你的 MBTI</label><select id="mbti"></select></div>
    <button class="btn" id="go">✨ 开始测试</button>
    <div class="err" id="err"></div>
  </div>

  <div id="result">
    <div class="card pcard">
      <img id="rImg" alt="">
      <div class="emoji" id="rEmoji"></div>
      <h2 id="rName"></h2>
      <div class="code" id="rCode"></div>
      <div class="divider"></div>
      <div class="lead" id="rLine"></div>
      <div class="body" id="rIntro"></div>
    </div>

    <div class="card pcard" id="cpCard">
      <div class="cp-cap">命定 CP</div>
      <img id="cpImg" alt="">
      <div class="emoji" id="cpEmoji"></div>
      <h2 id="cpName"></h2>
      <div class="code" id="cpCode"></div>
      <div class="divider"></div>
      <div class="body" id="cpMine" style="text-align:center"></div>
    </div>

    <div class="card">
      <details><summary>🔧 后台调试 · 完整得分榜</summary>
        <div id="dbgWarn"></div>
        <table id="dbgTable"></table>
      </details>
    </div>

    <span class="again" id="again">↻ 再测一次</span>
  </div>

  <footer>
    娱乐向自我探索 · 结果不构成任何承诺<br>
    天文计算在你的浏览器本地完成
  </footer>
</div>

<script>window.SCHEME='A';</script>
<script src="astronomy.browser.min.js"></script>
<script src="cities.js?v=6"></script>
<script src="personas.js?v=6"></script>
<script src="logic-v7.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
