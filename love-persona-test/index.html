<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>恋爱人设测试 · 你是哪种恋爱体质？</title>
<style>
  :root {
    --bg1: #fdeef4; --bg2: #ece9ff; --bg3: #e3f3ff;
    --ink: #3a2e45; --sub: #8b7f99;
    --brand: #b46cf0; --brand2: #f06cae;
    --card: rgba(255,255,255,.82);
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 48%, var(--bg3) 100%) fixed;
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 28px 18px 60px; }

  header { text-align: center; margin-bottom: 22px; }
  header .stars { font-size: 30px; letter-spacing: 6px; }
  header h1 {
    font-size: 26px; margin: 8px 0 6px; font-weight: 800;
    background: linear-gradient(90deg, var(--brand), var(--brand2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { color: var(--sub); font-size: 13px; }

  .card {
    background: var(--card); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: var(--radius);
    box-shadow: 0 10px 34px rgba(150,110,220,.13);
    padding: 20px 18px; margin-bottom: 16px;
  }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; color: #6d5a86; }
  .field label .opt { font-weight: 400; color: var(--sub); font-size: 12px; }
  input, select {
    width: 100%; padding: 12px 14px; font-size: 15px; color: var(--ink);
    border: 1.5px solid #e6dcf5; border-radius: 14px; background: #fff; outline: none;
    appearance: none; -webkit-appearance: none;
  }
  input:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(180,108,240,.14); }
  .row { display: flex; gap: 10px; }
  .row > .field { flex: 1; }

  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); margin-top: 8px; cursor: pointer; }
  .check input { width: auto; }

  .adv-toggle { font-size: 12.5px; color: var(--brand); cursor: pointer; user-select: none; margin: -6px 0 12px; display: inline-block; }
  #advBox { display: none; padding: 12px; background: #f7f2ff; border-radius: 14px; margin-bottom: 14px; }
  #advBox.show { display: block; }
  #advBox .hint { font-size: 11.5px; color: var(--sub); margin-top: 6px; line-height: 1.5; }

  .btn {
    width: 100%; padding: 15px; font-size: 17px; font-weight: 800; color: #fff;
    background: linear-gradient(90deg, var(--brand), var(--brand2));
    border: none; border-radius: 16px; cursor: pointer;
    box-shadow: 0 8px 22px rgba(200,100,200,.35);
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(.97); }
  .err { color: #e0507a; font-size: 13px; margin-top: 10px; display: none; text-align: center; }

  /* 结果区 */
  #result { display: none; }
  .r-hero { text-align: center; padding: 26px 18px 22px; }
  .r-hero .emoji { font-size: 62px; line-height: 1; }
  .r-hero h2 { font-size: 28px; font-weight: 900; margin: 10px 0 2px; }
  .r-hero .code { color: var(--brand); font-weight: 800; font-size: 15px; letter-spacing: 1px; }
  .r-hero .type { color: var(--sub); font-size: 13px; margin-top: 5px; }
  .badge {
    display: inline-block; margin-top: 12px; padding: 5px 14px; border-radius: 999px;
    font-size: 12.5px; font-weight: 700; color: #fff;
    background: linear-gradient(90deg, #9d7bf5, #f08bbb);
  }
  .r-line { font-size: 15px; font-weight: 700; text-align: center; margin: 14px 0 8px; color: #5d4a78; }
  .r-intro { font-size: 14px; line-height: 1.8; color: #6a5c7d; white-space: pre-line; text-align: left; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 16px; }
  .chip { font-size: 12px; padding: 5px 11px; border-radius: 999px; background: #f3ecfd; color: #7a5fa8; font-weight: 600; }

  .sec-title { font-size: 15px; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
  .cp-name { text-align: center; font-size: 20px; font-weight: 900; margin: 6px 0 14px; }
  .cp-name small { display:block; font-size: 12px; color: var(--sub); font-weight: 400; margin-top: 3px; }
  .view { background: #fbf7ff; border-radius: 14px; padding: 12px 14px; font-size: 13.5px; line-height: 1.75; color: #6a5c7d; margin-bottom: 10px; }
  .view b { color: var(--brand); font-size: 12px; display: block; margin-bottom: 3px; }

  details { margin-top: 4px; }
  summary { cursor: pointer; font-size: 13px; color: var(--sub); padding: 6px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { padding: 5px 4px; text-align: center; border-bottom: 1px solid #eee3f8; }
  th { color: #8b7f99; font-weight: 700; }
  tr.win td { color: var(--brand); font-weight: 800; }
  .profile-line { font-size: 12px; color: var(--sub); margin-top: 8px; }

  .again { display: block; text-align: center; color: var(--brand); font-size: 14px; font-weight: 700; margin-top: 6px; cursor: pointer; }
  footer { text-align: center; font-size: 11px; color: #b6aac4; margin-top: 26px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="stars">✦ ⋆ ˚ ☾ ˚ ⋆ ✦</div>
    <h1>恋爱人设测试</h1>
    <p>MBTI × 星盘 · 测测你是哪种恋爱体质</p>
  </header>

  <div class="card" id="form">
    <div class="field">
      <label>出生日期</label>
      <div class="row">
        <select id="selYear"><option value="">年</option></select>
        <select id="selMonth"><option value="">月</option></select>
        <select id="selDay"><option value="">日</option></select>
      </div>
    </div>
    <div class="field">
      <label>出生时间 <span class="opt">（不知道可勾选下方，会影响月亮和上升）</span></label>
      <div class="row">
        <select id="selHour"><option value="">时</option></select>
        <select id="selMinute"><option value="">分</option></select>
      </div>
      <label class="check"><input type="checkbox" id="noTime"> 我不知道出生时间</label>
    </div>
    <div class="field">
      <label>出生地点</label>
      <div class="row">
        <select id="selProvince"></select>
        <select id="selCity"></select>
      </div>
    </div>
    <span class="adv-toggle" id="advToggle">⚙️ 城市不在列表？手动输入经纬度 ▾</span>
    <div id="advBox">
      <div class="row">
        <div class="field"><label>纬度（北正南负）</label><input type="number" id="lat" step="0.0001" placeholder="39.63"></div>
        <div class="field"><label>经度（东正西负）</label><input type="number" id="lng" step="0.0001" placeholder="118.18"></div>
      </div>
      <div class="field">
        <label>当地时区（UTC 偏移小时）</label>
        <input type="number" id="utcoff" step="0.5" placeholder="8">
      </div>
      <div class="hint">填了经纬度就会用手动值代替上面的城市；时区填出生当时当地与 UTC 的时差（中国填 8，首尔/东京填 9，纽约冬令时填 -5）。</div>
    </div>
    <div class="field">
      <label>你的 MBTI</label>
      <select id="mbti"></select>
    </div>
    <button class="btn" id="go">✨ 开始测试</button>
    <div class="err" id="err"></div>
  </div>

  <div id="result">
    <div class="card r-hero">
      <div class="emoji" id="rEmoji"></div>
      <h2 id="rName"></h2>
      <div class="code" id="rCode"></div>
      <div class="type" id="rType"></div>
      <span class="badge" id="rConf"></span>
      <div class="r-line" id="rLine"></div>
      <div class="r-intro" id="rIntro"></div>
      <div class="chips" id="rChips"></div>
    </div>

    <div class="card">
      <div class="sec-title">💞 你的命定 CP</div>
      <div class="cp-name" id="cpName"></div>
      <div class="view" id="cpMine"></div>
    </div>

    <div class="card">
      <details>
        <summary>🔧 后台调试 · 完整得分榜</summary>
        <div class="profile-line" id="dbgProfile"></div>
        <table id="dbgTable"></table>
      </details>
    </div>

    <span class="again" id="again">↻ 再测一次</span>
  </div>

  <footer>
    娱乐向自我探索 · 结果不构成任何承诺<br>
    天文计算基于 astronomy-engine（本地引入，双击即可使用）
  </footer>
</div>

<script src="astronomy.browser.min.js"></script>
<script src="cities.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
